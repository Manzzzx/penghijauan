name: Auto Commit

on:
  schedule:
    - cron: '0 */6 * * *'  # Setiap 6 jam (4x sehari)
  workflow_dispatch:      # Tetap bisa dipicu manual

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Git and Timezone
        run: |
          git config --local user.email "147714843+Manzzzx@users.noreply.github.com"
          git config --local user.name "Manzzzx"
          export TZ="Asia/Jakarta"
      
      - name: Create commits
        run: |
          # Pull latest changes
          git pull origin main
          
          # Buat 5 commit dengan update README
          for i in {1..5}; do
            TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S WIB")
            
            # Update README dengan timestamp baru
            echo "Penghijauan" > README.md
            echo "Last updated: $TIMESTAMP" >> README.md
            echo "" >> README.md
            echo "Auto-commit" >> README.md
            
            # Commit dan tunggu sebentar
            git add README.md
            git commit -m "Auto commit - $TIMESTAMP"
            
            if [ $i -ne 5 ]; then
              sleep 30
            fi
          done
          
          # Push semua perubahan
          git push origin main