name: Auto Commit

on:
  schedule:
    - cron: '0 2 * * *'    # 02:00 UTC (09:00 WIB)
    - cron: '0 6 * * *'    # 06:00 UTC (13:00 WIB)
    - cron: '0 10 * * *'   # 10:00 UTC (17:00 WIB)
    - cron: '0 14 * * *'   # 14:00 UTC (21:00 WIB)
    - cron: '0 18 * * *'   # 18:00 UTC (01:00 WIB+1)
  workflow_dispatch:      # Tetap bisa dipicu manual

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Git
        run: |
          git config --local user.email "147714843+Manzzzx@users.noreply.github.com"
          git config --local user.name "Manzzzx"
      
      - name: Create multiple commits
        run: |
          # Pull the latest changes to avoid conflicts
          git pull origin main

          mkdir -p commits
          rm -rf commits/*
          
          for i in {1..4}; do
            current_time=$(date +%Y%m%d-%H%M%S)
            echo "Commit ke-$i pada $(date)" > "commits/commit-latest.txt"
            
            git add .
            git commit -m "Auto commit #$i - $(date)"
            
            sleep 30
          done
          
          git push origin main